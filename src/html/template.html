<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="darkreader-lock"><!-- the page has its own dark theme; stops the Dark Reader extension from repainting it -->
<title>{{TITLE}} - codegraph</title>
<style>
/*STYLE*/</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 28 28" aria-hidden="true"><rect class="tile" x=".5" y=".5" width="27" height="27" rx="8"/><path class="ln" d="M9 18.5 14 9.5l5.5 8.5M9 18.5h10.5"/><circle class="nd" cx="9" cy="18.5" r="2.4"/><circle class="nd" cx="14" cy="9.5" r="2.4"/><circle class="nd" cx="19.5" cy="18" r="2.4"/></svg>
    <div class="name"><h1>{{TITLE}}</h1><span class="sub">codegraph</span></div>
  </div>
  <div class="controls">
    <div class="field search">
      <span data-icon="search"></span>
      <input id="search" type="search" placeholder="Search files or functions" aria-label="Search files or functions" aria-keyshortcuts="/" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>
    <div class="field" id="folderHost"></div>
    <div class="field" id="kindHost"></div>
    <div class="seg" role="group" aria-label="View">
      <button id="m3d" type="button" aria-pressed="true" title="3D view" aria-label="3D view" data-icon="layers">3D</button>
      <button id="mflat" type="button" aria-pressed="false" title="Flat view" aria-label="Flat view" data-icon="square">Flat</button>
    </div>
    <label class="spin" title="Slowly rotate the 3D view (pauses while you interact, resumes after 3 seconds)"><input id="spin" class="switch" type="checkbox" checked aria-label="Auto-rotate the 3D view"> Spin</label>
  </div>
  <div class="tools">
    <button id="reset" class="ibtn" type="button" title="Reset view (fit the whole graph)" aria-label="Reset view" data-icon="reset"></button>
    <div class="seg icons" role="group" aria-label="Colour theme">
      <button type="button" data-theme-val="system" title="System theme" aria-label="System theme" aria-pressed="true" data-icon="monitor"></button>
      <button type="button" data-theme-val="light" title="Light theme" aria-label="Light theme" aria-pressed="false" data-icon="sun"></button>
      <button type="button" data-theme-val="dark" title="Dark theme" aria-label="Dark theme" aria-pressed="false" data-icon="moon"></button>
    </div>
  </div>
</header>
<main>
  <div id="view">
    <canvas id="bg" aria-hidden="true"></canvas>
    <canvas id="canvas" role="img" aria-label="Graph of the project's files and the links between them. Use the search box and Enter to open a file."></canvas>
    <div id="status" aria-live="polite"></div>
    <div id="hints" aria-hidden="true">
      <span class="chip"><kbd>Drag</kbd> <span id="hintDrag">rotate</span></span>
      <span class="chip"><kbd>Scroll</kbd> zoom</span>
      <span id="hintPan" class="chip"><kbd>Shift</kbd> drag to pan</span>
    </div>
    <div id="empty" hidden></div>
    <div id="announce" class="vh" role="status" aria-live="polite"></div>
  </div>
  <aside id="side">
    <div id="panel"></div>
    <div id="legend"></div>
  </aside>
</main>
<div id="tip" role="tooltip" aria-hidden="true"></div>
<script>
/*SCRIPT*/</script>
</body>
</html>
